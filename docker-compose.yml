# CP2 — Stack chạy ở máy: nginx (cổng 8000) → agent (N instance) → redis
#
#   docker compose up -d                        # 1 agent
#   docker compose up -d --scale agent=3        # 3 agent, nginx round-robin
#   docker compose restart nginx                # sau khi đổi số instance

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  agent:
    build: .
    image: day12-agent:prod
    # Không publish ra host để scale nhiều instance không tranh cổng;
    # traffic từ ngoài đi qua nginx ở localhost:8000
    expose:
      - "8000"
    environment:
      AGENT_API_KEY: ${AGENT_API_KEY:?AGENT_API_KEY chưa được set trong .env}
      REDIS_URL: redis://redis:6379/0
      PORT: "8000"
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-10}
      MONTHLY_BUDGET_USD: ${MONTHLY_BUDGET_USD:-10.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).read()"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 30s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      agent:
        condition: service_healthy

volumes:
  redis-data:
